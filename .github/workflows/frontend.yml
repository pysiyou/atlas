name: frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'config/ui-strings.json'
      - 'config/ui-strings.schema.json'
      - 'config/client-config.json'
      - 'config/client-config.schema.json'
      - 'contracts/**'
      - 'backend/app/shared/clinical.py'
      - 'backend/app/domains/**/schemas.py'
      - 'backend/app/domains/**/api.py'
      - 'backend/app/domains/catalog/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'config/ui-strings.json'
      - 'config/ui-strings.schema.json'
      - 'config/client-config.json'
      - 'config/client-config.schema.json'
      - 'contracts/**'
      - 'backend/app/shared/clinical.py'
      - 'backend/app/domains/**/schemas.py'
      - 'backend/app/domains/**/api.py'
      - 'backend/app/domains/catalog/**'
      - 'scripts/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install poetry
        working-directory: backend
      - run: poetry install
        working-directory: backend
      - run: npm run validate:client-config
      - run: npm run validate:ui-strings
      - run: npm run codegen:contracts
      - name: Assert committed codegen outputs match contracts
        run: |
          git diff --exit-code -- \
            ../frontend/src/types/generated \
            ../backend/app/shared/generated/enums.py \
            ../contracts/openapi.json
      - run: npm run check:openapi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build