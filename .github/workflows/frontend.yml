name: frontend

on:
  push:
    paths:
      - 'frontend/**'
      - 'config/ui-strings.json'
      - 'config/ui-strings.schema.json'
      - 'config/client-config.json'
      - 'config/client-config.schema.json'
      - 'contracts/catalog/**'
      - 'contracts/registries/sample-rejection-reasons.json'
      - 'contracts/registries/result-rejection-reasons.json'
      - 'contracts/registries/entity-ids.json'
      - 'backend/app/platform/utils.py'
      - 'scripts/validate-*.mjs'
      - 'scripts/generate-audit-catalog.mjs'
      - 'scripts/generate-clinical-workups.mjs'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'config/ui-strings.json'
      - 'config/ui-strings.schema.json'
      - 'config/client-config.json'
      - 'config/client-config.schema.json'
      - 'contracts/catalog/**'
      - 'contracts/registries/sample-rejection-reasons.json'
      - 'contracts/registries/result-rejection-reasons.json'
      - 'contracts/registries/entity-ids.json'
      - 'backend/app/platform/utils.py'
      - 'scripts/validate-*.mjs'
      - 'scripts/generate-audit-catalog.mjs'
      - 'scripts/generate-clinical-workups.mjs'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run validate:client-config
      - run: npm run validate:ui-strings
      - run: npm run validate:catalog
      - run: npm run validate:entity-ids
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build